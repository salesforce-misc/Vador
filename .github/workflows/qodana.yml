name: Qodana

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pull-request:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      QODANA_IMAGE: jetbrains/qodana-jvm-community:2026.2@sha256:8ff36b5cebc0a6d720f77dcf3e0a94a03c39b4c42c3724a99ce5f7e462e42f99
      QODANA_AMD64_DIGEST: sha256:5d095f312fc89cc1e7be266ceec6aed71d1aa3033557b5aa359075c08b7147d7
      QODANA_ARM64_DIGEST: sha256:30e9cc77daeaf908d93a91b8667b7eb1a85336a4349778a268f377a54ff9c79f
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: jetbrains
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Verify immutable Qodana image
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "$QODANA_IMAGE" --raw)"
          grep -Fq "$QODANA_AMD64_DIGEST" <<<"$manifest"
          grep -Fq "$QODANA_ARM64_DIGEST" <<<"$manifest"

      - name: Generate sources for analysis
        run: ./gradlew :vador:kaptKotlin :vador:classes :matchers:classes --warning-mode all --console=plain

      - name: Qodana PR scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --image,${{ env.QODANA_IMAGE }}
          cache-default-branch-only: true
          post-pr-comment: false
          pr-mode: true
          upload-result: false
          use-annotations: false

      - name: Upload Qodana PR report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qodana-pr-report
          path: ${{ runner.temp }}/qodana/results
          if-no-files-found: warn
          retention-days: 7

  trusted-master:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    env:
      QODANA_IMAGE: jetbrains/qodana-jvm-community:2026.2@sha256:8ff36b5cebc0a6d720f77dcf3e0a94a03c39b4c42c3724a99ce5f7e462e42f99
      QODANA_AMD64_DIGEST: sha256:5d095f312fc89cc1e7be266ceec6aed71d1aa3033557b5aa359075c08b7147d7
      QODANA_ARM64_DIGEST: sha256:30e9cc77daeaf908d93a91b8667b7eb1a85336a4349778a268f377a54ff9c79f
    steps:
      - name: Checkout trusted master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: jetbrains
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Verify immutable Qodana image
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect "$QODANA_IMAGE" --raw)"
          grep -Fq "$QODANA_AMD64_DIGEST" <<<"$manifest"
          grep -Fq "$QODANA_ARM64_DIGEST" <<<"$manifest"

      - name: Generate sources for analysis
        run: ./gradlew :vador:kaptKotlin :vador:classes :matchers:classes --warning-mode all --console=plain

      - name: Qodana trusted master scan
        id: qodana
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: --image,${{ env.QODANA_IMAGE }}
          cache-default-branch-only: true
          post-pr-comment: false
          pr-mode: false
          upload-result: true
          use-annotations: false

      - name: Detect SARIF report
        id: sarif
        if: ${{ !cancelled() }}
        shell: bash
        env:
          QODANA_OUTCOME: ${{ steps.qodana.outcome }}
        run: |
          if [[ -f "$RUNNER_TEMP/qodana/results/qodana.sarif.json" ]]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          elif [[ "$QODANA_OUTCOME" == "success" ]]; then
            echo "::error::Qodana succeeded without producing its SARIF report"
            exit 1
          else
            echo "::warning::Qodana did not produce a SARIF report"
          fi

      - name: Upload SARIF to code scanning
        if: ${{ steps.sarif.outputs.available == 'true' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json
